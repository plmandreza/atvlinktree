<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col items-center text-center">

        <div class="w-24 h-24 bg-amber-600 rounded-full flex items-center justify-center text-2xl font-bold tracking-wider mb-4 border-2 border-amber-500 shadow-md text-white">
            FS
        </div>

        <h1 class="text-xl font-semibold mb-1">Dr. Fictício da Silva</h1>
        <p class="text-sm text-amber-400 mb-6 font-medium">Advogado Especialista | Direito Penal e Criminal</p>

        <div class="w-full flex flex-col gap-3">
            <a href="https://wa.me/" target="_blank" rel="noopener noreferrer" 
               class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 py-3 px-4 rounded-xl font-medium transition-all duration-200 shadow-sm hover:scale-[1.02]">
                WhatsApp
            </a>

            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" 
               class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 py-3 px-4 rounded-xl font-medium transition-all duration-200 shadow-sm hover:scale-[1.02]">
                LinkedIn
            </a>

            <a href="mailto:contato@advocaciaficticia.com" 
               class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 py-3 px-4 rounded-xl font-medium transition-all duration-200 shadow-sm hover:scale-[1.02]">
                E-mail
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" 
               class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 py-3 px-4 rounded-xl font-medium transition-all duration-200 shadow-sm hover:scale-[1.02]">
                Instagram
            </a>
        </div>
    </main>
</body>
</html>
